services:
  # Serwuje statyczną stronę (HTML/CSS/JS) na porcie 8080 hosta.
  #
  # UWAGA: ten serwer stoi za Pangolinem (tunel + TLS po stronie Pangolina),
  # dlatego NIE ma tutaj Caddy/Let's Encrypt — Pangolin już terminuje HTTPS
  # i przekazuje zwykły HTTP do tego kontenera na porcie 8080.
  # "Resource" w dashboardzie Pangolina musi wskazywać na port 8080 tego hosta.
  mhid-countdown:
    build: .
    container_name: mhid-countdown
    restart: unless-stopped
    ports:
      - "8080:80"
